spring:
  application:
    name: blog-api

  cloud:
    openfeign:
      # liga o circuit breaker nos clientes feign. sem isto, o fallbackFactory declarado
      # no @FeignClient e simplesmente ignorado -- a chamada falha crua.
      #
      # fica aqui, e nao no config server, porque nao e ajuste de ambiente: e uma decisao
      # de como o codigo se comporta, e desligar isto por configuracao quebraria o
      # contrato que os testes do fallback garantem. os TIMEOUTS, que sao ajuste, estao
      # centralizados em blog-api.yml.
      circuitbreaker:
        enabled: true

  # banco deste servico: posts e autores. comentarios e reacoes vivem no banco do
  # engagement-service, e nao ha juncao possivel entre os dois -- e essa separacao que
  # torna os dois processos independentes de verdade.
  datasource:
    url: jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      # o envers le suas configuracoes com o prefixo completo org.hibernate.envers.
      # store_data_at_delete guarda o estado do registro tambem na revisao de
      # exclusao, para o historico mostrar como ele estava antes de ser apagado.
      org.hibernate.envers.store_data_at_delete: true

  # console web do h2 em http://localhost:8080/h2-console (jdbc url: jdbc:h2:mem:blogdb)
  h2:
    console:
      enabled: true
      path: /h2-console

  # as migracoes do flyway existem para o postgres do ambiente de conteiner, e so rodam
  # la (perfil container, no fim deste arquivo). aqui, com h2 em memoria, o schema
  # continua vindo das entidades (ddl-auto), como nas entregas anteriores.
  flyway:
    enabled: false

  # mensageria. o endereco do broker, as retentativas e o intervalo do outbox sao ajuste
  # de ambiente e vem do config server; o que fica aqui sao as decisoes de codigo.
  rabbitmq:
    # confirmacao de publicacao: o broker responde se aceitou cada mensagem. o outbox e o
    # envio do comando de comentario dependem disso para saber que a mensagem esta
    # guardada (veja ConfirmedPublisher). desligar quebraria os dois, entao nao e ajuste.
    publisher-confirm-type: simple
    listener:
      simple:
        # uma mensagem que falhou de vez NAO volta para a fila (evita o loop de uma
        # mensagem invalida entregue e recusada para sempre). recusada, ela vai para a
        # dead letter declarada em cada fila.
        default-requeue-rejected: false
        retry:
          enabled: true

server:
  port: 8080

# endereco fixo do microsservico. vazio (o padrao) significa "resolva pelo eureka", que e
# o caminho normal. preencher aqui -- ou passar
# --engagement.service.url=http://localhost:8081 na linha de comando -- faz o cliente ir
# direto ao endereco, o que permite rodar sem o servidor de descoberta. e uma saida de
# emergencia, nao o modo de operacao.
engagement:
  service:
    url: ""

---
# ---------------------------------------------------------------------------------
# o ambiente de conteiner (docker compose e kubernetes), ativado por
# SPRING_PROFILES_ACTIVE=container. quinta entrega.
#
# o mesmo criterio da configuracao central vale aqui: o que e ENDERECO ou CREDENCIAL do
# ambiente (a url do postgres, o host do broker, o registro) vem do config server, nos
# arquivos *-container.yml; o que e DECISAO de como o codigo se comporta em producao
# fica neste documento, junto do servico:
#
# - o schema vem das migracoes do flyway (src/main/resources/db/migration), e o
#   hibernate so confere se o mapeamento bate com ele. gerar schema a partir das
#   entidades e conveniente em desenvolvimento e perigoso em producao: uma mudanca de
#   entidade viraria, sem revisao, um alter table no banco de verdade.
# - sem sql no log e sem console do banco exposto.
# - as sondas de liveness e readiness no actuator, que o kubernetes e o compose usam
#   para saber se o processo esta vivo e pronto para trafego.
# - o id de trace e de span em cada linha de log. quem os coloca no MDC e o agente do
#   opentelemetry que as imagens carregam; e o que permite ir de uma linha de log ao
#   trace completo no grafana, e voltar.
# ---------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: container

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{trace_id:-},%X{span_id:-}]"

---
# ---------------------------------------------------------------------------------
# a busca da configuracao no servidor central.
#
# fica em um documento separado, ativado apenas FORA do perfil de teste, e a razao e
# tecnica: o spring resolve o spring.config.import muito cedo, antes de ler
# application-test.yml -- entao desligar o cliente por ali chegaria tarde e os testes
# passariam a exigir um config server no ar. condicionar o proprio import ao perfil
# resolve isso e continua valendo quando os testes rodam pela IDE, sem depender de
# nenhuma flag na linha de comando.
#
# o import NAO e opcional de proposito. um servico que subisse sem as politicas que
# espera estaria rodando com um comportamento diferente do pretendido, e descobrir isso
# em producao e pior do que nao subir. o spring-retry no classpath, com o fail-fast
# abaixo, faz o servico ESPERAR o config server em vez de morrer quando a ordem de
# subida se inverte -- ate 20 tentativas, com 1 a 2 segundos entre elas.
# ---------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 2000

# ---------------------------------------------------------------------------------
# o que este arquivo NAO tem mais, e onde foi parar:
#
#   eureka.client.service-url          -> config-server, application.yml (coringa)
#   eureka.instance.prefer-ip-address  -> config-server, application.yml (coringa)
#   eureka.client.registry-fetch-...   -> config-server, blog-api.yml
#   app.cors.allowed-origin            -> config-server, blog-api.yml
#   spring.cloud.openfeign.client...   -> config-server, blog-api.yml (timeouts)
#   resilience4j.*                     -> config-server, blog-api.yml
#   spring.rabbitmq.host/port/usuario  -> config-server, application.yml (coringa)
#   spring.rabbitmq.listener.retry.*   -> config-server, blog-api.yml
#   blog.messaging.* (outbox, confirm) -> config-server, blog-api.yml
#
# o que sobrou aqui e o que define ESTE servico: o nome, o banco, a porta e as decisoes
# de codigo. o que saiu e o que muda entre ambientes.
# ---------------------------------------------------------------------------------
