spring:
  application:
    name: blog-api

  # banco deste servico: posts e autores. comentarios e reacoes vivem no banco do
  # engagement-service, e nao ha juncao possivel entre os dois -- e essa separacao
  # que torna os dois processos independentes de verdade.
  datasource:
    url: jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      # o envers le suas configuracoes com o prefixo completo org.hibernate.envers.
      # store_data_at_delete guarda o estado do registro tambem na revisao de
      # exclusao, para o historico mostrar como ele estava antes de ser apagado.
      org.hibernate.envers.store_data_at_delete: true

  # console web do h2 em http://localhost:8080/h2-console (jdbc url: jdbc:h2:mem:blogdb)
  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    openfeign:
      # liga o circuit breaker nos clientes feign. sem isto, o fallbackFactory
      # declarado no @FeignClient e simplesmente ignorado -- a chamada falha crua.
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # os timeouts do http precisam ser menores que o do time limiter do
            # resilience4j (abaixo), senao o circuito estoura antes de o proprio
            # cliente desistir e a causa da falha fica confusa no log.
            connect-timeout: 2000
            read-timeout: 3000
            logger-level: basic

# resiliencia da chamada ao engajamento.
#
# os dois blocos abaixo usam a configuracao "default" de proposito: o spring cloud
# cria um circuito por metodo do cliente feign, com nomes derivados da assinatura, e
# nomear cada um seria repeticao inutil. a politica e a mesma para todos.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 8
        minimum-number-of-calls: 4          # nao abre o circuito no primeiro tropeco
        failure-rate-threshold: 50          # metade das chamadas falhando e o bastante
        wait-duration-in-open-state: 10s    # depois disso, tenta de novo
        permitted-number-of-calls-in-half-open-state: 2
        # erros de negocio que atravessaram a fronteira (um comentario que nao
        # existe, uma reacao repetida) NAO sao falha do servico. sem esta lista, um
        # leitor insistindo em reagir duas vezes abriria o circuito e derrubaria o
        # engajamento para todo mundo.
        ignore-exceptions:
          - com.blog.shared.exception.ResourceNotFoundException
          - com.blog.shared.exception.BusinessRuleException
          - com.blog.shared.exception.InvalidRequestException

  timelimiter:
    configs:
      default:
        # o padrao do time limiter e 1 segundo, curto demais para uma chamada http
        # real: em uma maquina carregada, chamadas legitimas comecariam a ser
        # cortadas e o circuito abriria sem que nada estivesse errado.
        timeout-duration: 5s
        cancel-running-future: true

# descoberta de servicos: e o registro que diz onde o engagement-service esta.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # o padrao busca a tabela de instancias a cada 30s. subindo os tres processos
    # juntos, isso significa ate meio minuto em que o monolito ainda nao viu o
    # engajamento e responde 503 -- correto, mas confuso de demonstrar. 10s deixa a
    # subida e a recuperacao visiveis sem inundar o registro de requisicoes.
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true

server:
  port: 8080

# origem do front-end (vite) liberada para chamadas cross-origin. continua sendo uma
# so porque o navegador conversa apenas com este servico: o engajamento e alcancado
# por dentro, servidor a servidor.
app:
  cors:
    allowed-origin: http://localhost:5173

# endereco fixo do microsservico. vazio (o padrao) significa "resolva pelo eureka",
# que e o caminho normal. preencher aqui -- ou passar
# --engagement.service.url=http://localhost:8081 na linha de comando -- faz o cliente
# ir direto ao endereco, o que permite rodar a stack sem subir o servidor de
# descoberta. e uma saida de emergencia, nao o modo de operacao.
engagement:
  service:
    url: ""
