# perfil usado pelos testes. mantem o mesmo h2 em memoria da aplicacao, apenas com o
# log de sql desligado para a saida dos testes ficar limpa. o DataSeeder esta anotado
# com @Profile("!test"), entao nao roda aqui e os testes partem de um banco vazio.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# o cliente do eureka fica desligado nos testes: nenhum teste deve depender de um
# servidor de descoberta rodando na maquina, e sem isto o contexto gastaria segundos
# em retentativas de registro a cada classe de teste.
#
# a descoberta em si (o bean DiscoveryClient) continua no contexto, so sem nenhum
# cliente por tras. e justamente o cenario que o EngagementStatusService trata,
# devolvendo zero instancia registrada em vez de quebrar.
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# os testes de integracao trocam o EngagementClient por um substituto, entao nenhuma
# chamada http sai daqui. o endereco existe para o cliente feign ser construido sem
# consultar a descoberta, e aponta para uma porta invalida de proposito: se algum
# teste esquecer de substituir o cliente, a chamada falha na hora em vez de ficar
# pendurada esperando timeout.
engagement:
  service:
    url: http://localhost:0
