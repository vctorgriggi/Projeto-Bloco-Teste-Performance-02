# perfil usado pelos testes. mantem o mesmo h2 em memoria da aplicacao, apenas
# com o log de sql desligado para a saida dos testes ficar limpa. o DataSeeder
# esta anotado com @Profile("!test"), entao nao roda aqui e os testes partem de
# um banco vazio.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
