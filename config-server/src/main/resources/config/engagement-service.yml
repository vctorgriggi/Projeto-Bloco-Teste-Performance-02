# ---------------------------------------------------------------------------------
# propriedades do microsservico (spring.application.name = engagement-service).
# ---------------------------------------------------------------------------------

eureka:
  client:
    # publica o resultado do health check do actuator no registro, para o eureka marcar
    # a instancia como fora do ar quando o banco cair, e nao apenas quando o processo
    # morrer
    healthcheck:
      enabled: true
  instance:
    # batidas mais frequentes que o padrao (30s/90s) para a queda do servico aparecer
    # rapido durante a demonstracao
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 20

management:
  endpoints:
    web:
      exposure:
        # serviceregistry: o preStop do kubernetes marca a instancia como DOWN no eureka
        # antes de ela ser encerrada (veja k8s/40-engagement-service.yaml). so e
        # alcancavel de dentro do cluster: nenhuma porta deste servico e publicada.
        include: health,info,serviceregistry
  endpoint:
    health:
      show-details: always

# ---------------------------------------------------------------------------------
# mensageria (quarta entrega)
# ---------------------------------------------------------------------------------

spring:
  rabbitmq:
    listener:
      simple:
        # consumidores concorrentes por fila, por instancia. o spring abre mais
        # consumidores (ate max-concurrency) quando a fila acumula e fecha quando esvazia.
        # somado a subir mais instancias, e o botao de escala da escrita de comentarios --
        # e e ajuste de operacao, nao de codigo
        concurrency: 1
        max-concurrency: 4
        # quantas mensagens cada consumidor pega adiantado. baixo o bastante para a carga
        # se dividir entre os consumidores em vez de um so segurar a fila inteira
        prefetch: 10
        retry:
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
