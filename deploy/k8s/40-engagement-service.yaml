# o microsservico, com duas replicas desde o inicio e autoescalonamento ate quatro.
#
# as replicas dividem as duas coisas que o engajamento atende: as chamadas http do
# monolito (o eureka ve os dois pods, e o load balancer alterna) e as mensagens das
# filas (consumidores concorrentes na mesma fila). com o postgres, as duas enxergam o
# mesmo banco -- o que o h2 em memoria nao permitia.
apiVersion: v1
kind: Service
metadata:
  name: engagement-service
  namespace: blog
  labels: { app.kubernetes.io/name: engagement-service, app.kubernetes.io/part-of: blog }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: engagement-service }
  ports:
    - { name: http, port: 8081, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-service
  namespace: blog
  labels: { app.kubernetes.io/name: engagement-service, app.kubernetes.io/part-of: blog }
spec:
  replicas: 2
  # o kubernetes so considera o pod novo "disponivel" 20s depois de ele ficar pronto, e so
  # entao encerra o proximo antigo. sem isso, medido: o rollout trocava as duas replicas
  # mais rapido do que o monolito atualizava a tabela do eureka, e por um instante ele
  # nao via instancia nenhuma ("No servers available"). o prazo cobre o cache do
  # registro (3s no servidor, 5s no cliente, 5s no load balancer).
  minReadySeconds: 20
  selector:
    matchLabels: { app.kubernetes.io/name: engagement-service }
  # troca de versao sem queda: sobe o pod novo, espera ele ficar pronto (readiness) e so
  # entao derruba um antigo
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: engagement-service, app.kubernetes.io/part-of: blog }
    spec:
      # sem as variaveis que o kubernetes injeta para cada Service do namespace
      # (RABBITMQ_PORT=tcp://10.96.x.x:5672, POSTGRES_PORT=...). a descoberta aqui e por
      # dns, e essas variaveis colidiam com as do config server: ${RABBITMQ_PORT:5672}
      # virava "tcp://..." e o servico nao subia. achado na primeira implantacao no kind.
      enableServiceLinks: false
      # o spring encerra com graca (termina as requisicoes e mensagens em andamento)
      # dentro deste prazo, depois do SIGTERM
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
      # a jvm so sobe quando o banco e o broker aceitam conexao. sem isto, numa subida do
      # zero (tudo aplicado de uma vez), o flyway tentava o postgres antes de ele estar
      # pronto, o servico morria e o kubernetes o reiniciava ate dar certo -- convergia,
      # mas com dois reinicios por pod e mais cpu disputada na subida. medido na
      # primeira implantacao do zero; aqui a espera fica explicita (Init:0/1).
      initContainers:
        - name: espera-dependencias
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z -w 2 postgres 5432; do echo "esperando o postgres"; sleep 2; done;
              until nc -z -w 2 rabbitmq 5672; do echo "esperando o rabbitmq"; sleep 2; done
          securityContext:
            runAsUser: 10001
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 16Mi }
      containers:
        - name: engagement-service
          image: blog/engagement-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: blog-java }
          env:
            # o nome do pod vira atributo de cada trace, log e metrica: e o que separa as
            # duas replicas do engajamento no grafana
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=kubernetes,k8s.namespace.name=blog,k8s.pod.name=$(POD_NAME)
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: blog-segredos, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: blog-segredos, key: RABBITMQ_PASSWORD } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: blog-segredos, key: ENGAGEMENT_DB_PASSWORD } }
          # a saida sem queda de uma replica, numa atualizacao ou numa reducao do hpa:
          # 1. ela se marca DOWN no eureka, e os clientes param de escolhe-la assim que
          #    atualizam a tabela (poucos segundos, com os caches curtos do config server);
          # 2. continua atendendo durante esse intervalo, para as chamadas que ainda
          #    chegarem a ela;
          # 3. so entao recebe o SIGTERM, e o spring encerra com graca.
          # sem isto, medido: 28% de 503 durante um rollout.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >-
                    wget -qO- --header 'Content-Type: application/json'
                    --post-data '{"status":"DOWN"}'
                    http://localhost:8081/actuator/serviceregistry || true;
                    sleep 20
          # startup: a jvm com o agente leva uns 20-40s para subir; durante esse tempo as
          # outras sondas nao rodam, e o pod nao e morto por estar "lento"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          # liveness: o processo travou? o kubernetes reinicia o conteiner
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          # readiness: pode receber trafego? se nao, sai do Service ate voltar
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            # o request de cpu e a base do autoescalonamento (hpa) e da distribuicao
            # pelos nos; o limite de memoria e o que a jvm usa para dimensionar o heap
            # (MaxRAMPercentage=75 na imagem). sem limite de cpu de proposito: limitar
            # cpu de jvm causa throttling em rajadas, como no startup.
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
---
# autoescalonamento por cpu: se a media passar de 70% do request, o kubernetes sobe
# replicas (ate 4); quando a carga cai, desce de volta ate 2. depende do metrics-server
# no cluster (o scripts/k8s-subir.sh instala). as janelas de estabilizacao evitam que o
# numero de replicas fique oscilando (veja behavior).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engagement-service
  namespace: blog
  labels: { app.kubernetes.io/name: engagement-service, app.kubernetes.io/part-of: blog }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engagement-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    # sem janela na subida, medido: ao fim de uma rajada o hpa descia para 2 e, 15s
    # depois, subia de novo para 4 -- o metrics-server ainda trazia a cpu do periodo de
    # carga, agora dividida por dois pods. com a janela, a subida exige que a
    # recomendacao se sustente por 45s, e uma leitura atrasada nao dispara nada.
    scaleUp:
      stabilizationWindowSeconds: 45
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
---
# numa manutencao do no (drain), o kubernetes nunca derruba as duas replicas ao mesmo
# tempo: pelo menos uma continua atendendo
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: engagement-service
  namespace: blog
  labels: { app.kubernetes.io/name: engagement-service, app.kubernetes.io/part-of: blog }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: engagement-service }
