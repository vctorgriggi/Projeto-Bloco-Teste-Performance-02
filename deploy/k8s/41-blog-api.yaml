# o monolito. uma replica so, e a razao esta no outbox: o relay de duas instancias
# leria as mesmas linhas pendentes e publicaria em dobro. os consumidores toleram
# (sao idempotentes), mas escalar o monolito pede antes travar as linhas na leitura
# (select ... for update skip locked) -- registrado em docs/IMPLANTACAO.md.
apiVersion: v1
kind: Service
metadata:
  name: blog-api
  namespace: blog
  labels: { app.kubernetes.io/name: blog-api, app.kubernetes.io/part-of: blog }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: blog-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog
  labels: { app.kubernetes.io/name: blog-api, app.kubernetes.io/part-of: blog }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: blog-api }
  # troca de versao sem queda: sobe o pod novo, espera ele ficar pronto (readiness) e so
  # entao derruba um antigo
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: blog-api, app.kubernetes.io/part-of: blog }
    spec:
      # sem as variaveis que o kubernetes injeta para cada Service do namespace
      # (RABBITMQ_PORT=tcp://10.96.x.x:5672, POSTGRES_PORT=...). a descoberta aqui e por
      # dns, e essas variaveis colidiam com as do config server: ${RABBITMQ_PORT:5672}
      # virava "tcp://..." e o servico nao subia. achado na primeira implantacao no kind.
      enableServiceLinks: false
      # o spring encerra com graca (termina as requisicoes e mensagens em andamento)
      # dentro deste prazo, depois do SIGTERM
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      # a jvm so sobe quando o banco e o broker aceitam conexao. sem isto, numa subida do
      # zero (tudo aplicado de uma vez), o flyway tentava o postgres antes de ele estar
      # pronto, o servico morria e o kubernetes o reiniciava ate dar certo -- convergia,
      # mas com dois reinicios por pod e mais cpu disputada na subida. medido na
      # primeira implantacao do zero; aqui a espera fica explicita (Init:0/1).
      initContainers:
        - name: espera-dependencias
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z -w 2 postgres 5432; do echo "esperando o postgres"; sleep 2; done;
              until nc -z -w 2 rabbitmq 5672; do echo "esperando o rabbitmq"; sleep 2; done
          securityContext:
            runAsUser: 10001
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 16Mi }
      containers:
        - name: blog-api
          image: blog/blog-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: blog-java }
          env:
            # o nome do pod vira atributo de cada trace, log e metrica: e o que separa as
            # duas replicas do engajamento no grafana
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=kubernetes,k8s.namespace.name=blog,k8s.pod.name=$(POD_NAME)
            - name: RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: blog-segredos, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: blog-segredos, key: RABBITMQ_PASSWORD } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: blog-segredos, key: BLOG_DB_PASSWORD } }
          # o kubernetes tira o pod do Service e manda o SIGTERM ao mesmo tempo; a pausa
          # cobre as requisicoes que ainda chegam enquanto o nginx e o kube-proxy se
          # atualizam
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # startup: a jvm com o agente leva uns 20-40s para subir; durante esse tempo as
          # outras sondas nao rodam, e o pod nao e morto por estar "lento"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          # liveness: o processo travou? o kubernetes reinicia o conteiner
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          # readiness: pode receber trafego? se nao, sai do Service ate voltar
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            # o request de cpu e a base do autoescalonamento (hpa) e da distribuicao
            # pelos nos; o limite de memoria e o que a jvm usa para dimensionar o heap
            # (MaxRAMPercentage=75 na imagem). sem limite de cpu de proposito: limitar
            # cpu de jvm causa throttling em rajadas, como no startup.
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
