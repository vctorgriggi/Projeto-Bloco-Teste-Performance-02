# o front: nginx servindo o build do vite e repassando /api ao Service do monolito. e a
# unica porta da aplicacao aberta para fora do cluster (NodePort 30080; em producao, um
# Ingress ou Gateway com dominio e tls). stateless, entao duas replicas sem cerimonia.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: blog
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: blog }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: frontend }
  ports:
    - { name: http, port: 8080, targetPort: http, nodePort: 30080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blog
  labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: blog }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: frontend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: blog }
    spec:
      # sem as variaveis que o kubernetes injeta para cada Service do namespace
      # (RABBITMQ_PORT=tcp://10.96.x.x:5672, POSTGRES_PORT=...). a descoberta aqui e por
      # dns, e essas variaveis colidiam com as do config server: ${RABBITMQ_PORT:5672}
      # virava "tcp://..." e o servico nao subia. achado na primeira implantacao no kind.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: blog/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: BLOG_API_URL
              value: http://blog-api:8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 64Mi }
