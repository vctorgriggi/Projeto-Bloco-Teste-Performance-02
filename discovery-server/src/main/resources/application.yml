spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  instance:
    hostname: localhost

  client:
    # este processo e o registro, nao um cliente: nao se registra em si mesmo
    # nem baixa a propria tabela de instancias.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

  server:
    # em producao a auto-preservacao evita que uma falha de rede derrube o
    # registro inteiro; em desenvolvimento ela atrasa a remocao de um servico
    # que foi encerrado, entao fica desligada e a expiracao roda a cada 5s.
    # assim, ao parar o microsservico, o painel reflete a queda rapido.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    # o servidor responde a tabela de instancias de um cache atualizado a cada 30s. com
    # isso, uma instancia marcada DOWN continuava aparecendo UP para os clientes por ate
    # meio minuto. 3s e o que permite a troca de versao no kubernetes sem 503 (quinta
    # entrega; o raciocinio completo esta em docs/IMPLANTACAO.md).
    response-cache-update-interval-ms: 3000

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
