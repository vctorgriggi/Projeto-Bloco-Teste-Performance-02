spring:
  # este nome nao e enfeite: e por ele que o servico se registra no eureka, por ele que o
  # monolito o procura e por ele que o config server sabe qual arquivo de propriedades
  # entregar. o @FeignClient do outro lado usa exatamente "engagement-service", nunca um
  # host ou uma porta.
  application:
    name: engagement-service

  # banco proprio do microsservico (um banco por servico). e outro schema, com outras
  # tabelas, sem nenhuma juncao possivel com posts e autores -- e essa separacao que
  # torna o servico realmente independente.
  datasource:
    url: jdbc:h2:mem:engagementdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      # a auditoria do comentario veio do monolito com a mesma configuracao: o prefixo
      # completo org.hibernate.envers. e obrigatorio, e store_data_at_delete preserva o
      # estado do comentario na revisao de exclusao.
      org.hibernate.envers.store_data_at_delete: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

---
# ---------------------------------------------------------------------------------
# a busca da configuracao no servidor central.
#
# fica em um documento separado, ativado apenas FORA do perfil de teste, e a razao e
# tecnica: o spring resolve o spring.config.import muito cedo, antes de ler
# application-test.yml -- entao desligar o cliente por ali chegaria tarde e os testes
# passariam a exigir um config server no ar. condicionar o proprio import ao perfil
# resolve isso e continua valendo quando os testes rodam pela IDE, sem depender de
# nenhuma flag na linha de comando.
#
# o import NAO e opcional de proposito. um servico que subisse sem as politicas que
# espera estaria rodando com um comportamento diferente do pretendido, e descobrir isso
# em producao e pior do que nao subir. o spring-retry no classpath, com o fail-fast
# abaixo, faz o servico ESPERAR o config server em vez de morrer quando a ordem de
# subida se inverte -- ate 20 tentativas, com 1 a 2 segundos entre elas.
# ---------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 2000

# ---------------------------------------------------------------------------------
# o que este arquivo NAO tem mais, e onde foi parar:
#
#   eureka.client.service-url            -> config-server, application.yml (coringa)
#   eureka.instance.prefer-ip-address    -> config-server, application.yml (coringa)
#   eureka.client.healthcheck            -> config-server, engagement-service.yml
#   eureka.instance.lease-*              -> config-server, engagement-service.yml
#   management.endpoints / endpoint       -> config-server, engagement-service.yml
#
# repare que o endereco do eureka saiu dos DOIS servicos e virou uma linha so no coringa.
# antes desta entrega ele estava duplicado, e duas copias de um endereco e uma delas
# esperando para ficar desatualizada.
# ---------------------------------------------------------------------------------
