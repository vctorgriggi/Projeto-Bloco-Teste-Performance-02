spring:
  # este nome nao e enfeite: e por ele que o servico se registra no eureka, por ele que o
  # monolito o procura e por ele que o config server sabe qual arquivo de propriedades
  # entregar. o @FeignClient do outro lado usa exatamente "engagement-service", nunca um
  # host ou uma porta.
  application:
    name: engagement-service

  # banco proprio do microsservico (um banco por servico). e outro schema, com outras
  # tabelas, sem nenhuma juncao possivel com posts e autores -- e essa separacao que
  # torna o servico realmente independente.
  datasource:
    url: jdbc:h2:mem:engagementdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      # a auditoria do comentario veio do monolito com a mesma configuracao: o prefixo
      # completo org.hibernate.envers. e obrigatorio, e store_data_at_delete preserva o
      # estado do comentario na revisao de exclusao.
      org.hibernate.envers.store_data_at_delete: true

  h2:
    console:
      enabled: true
      path: /h2-console

  # as migracoes do flyway existem para o postgres do ambiente de conteiner, e so rodam
  # la (perfil container, no fim deste arquivo). aqui, com h2 em memoria, o schema
  # continua vindo das entidades (ddl-auto), como nas entregas anteriores.
  flyway:
    enabled: false

  # mensageria. o endereco do broker e as politicas de retentativa sao ajuste de ambiente
  # e vem do config server; o que fica aqui sao as decisoes de como o codigo se comporta.
  rabbitmq:
    listener:
      simple:
        # os consumidores NAO ligam sozinhos na inicializacao do contexto: quem os liga e
        # o MessagingStartup, quando o servico termina de subir (depois do seeder). ligar
        # antes fez este servico processar mensagens num banco ainda vazio -- o defeito
        # esta descrito no proprio MessagingStartup.
        auto-startup: false
        # uma mensagem que falhou de vez NAO volta para a fila. voltar criaria um loop:
        # a mesma mensagem invalida seria entregue, recusada e entregue de novo, para
        # sempre, prendendo o consumidor. recusada, ela vai para a dead letter declarada
        # em cada fila (veja MessagingConfig).
        default-requeue-rejected: false
        # a retentativa em si fica ligada aqui porque o contrato da dead letter depende
        # dela; quantas vezes e com que intervalo, isso e ajuste, e esta no config server.
        retry:
          enabled: true

server:
  port: 8081

# o starter do amqp acrescenta o broker ao /actuator/health, e o eureka publica essa
# saude no registro (eureka.client.healthcheck, no config server). juntas, as duas coisas
# faziam o broker fora do ar derrubar este servico INTEIRO no registro: o monolito deixava
# de acha-lo, e ler a conversa ou reagir -- chamadas http que nao passam por fila nenhuma
# -- respondiam 503. foi encontrado derrubando o broker durante a demonstracao.
#
# a saude que o registro publica tem que responder "a api deste servico atende?", e o
# broker nao faz parte dessa resposta: sem ele, o servico continua lendo e gravando no
# proprio banco, e os eventos de melhor esforco vao para o log. a disponibilidade do
# broker e acompanhada por quem depende dela (o diagnostico do monolito) e pelo painel do
# rabbitmq. e decisao de codigo, e por isso fica aqui, e nao no config server.
management:
  health:
    rabbit:
      enabled: false

---
# ---------------------------------------------------------------------------------
# o ambiente de conteiner (docker compose e kubernetes), ativado por
# SPRING_PROFILES_ACTIVE=container. quinta entrega.
#
# o mesmo criterio da configuracao central vale aqui: o que e ENDERECO ou CREDENCIAL do
# ambiente (a url do postgres, o host do broker, o registro) vem do config server, nos
# arquivos *-container.yml; o que e DECISAO de como o codigo se comporta em producao
# fica neste documento, junto do servico:
#
# - o schema vem das migracoes do flyway (src/main/resources/db/migration), e o
#   hibernate so confere se o mapeamento bate com ele. gerar schema a partir das
#   entidades e conveniente em desenvolvimento e perigoso em producao: uma mudanca de
#   entidade viraria, sem revisao, um alter table no banco de verdade.
# - sem sql no log e sem console do banco exposto.
# - as sondas de liveness e readiness no actuator, que o kubernetes e o compose usam
#   para saber se o processo esta vivo e pronto para trafego.
# - o id de trace e de span em cada linha de log. quem os coloca no MDC e o agente do
#   opentelemetry que as imagens carregam; e o que permite ir de uma linha de log ao
#   trace completo no grafana, e voltar.
# ---------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: container

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{trace_id:-},%X{span_id:-}]"

# duas replicas deste servico sobem ao mesmo tempo contra o mesmo banco, e o seeder e
# "confere se esta vazio, entao insere": as duas veriam vazio e semeariam em dobro (a
# restricao de unicidade das reacoes derrubaria uma delas no startup). em producao os
# dados vem do uso, e nao de um seeder.
engagement:
  seed:
    enabled: false

---
# ---------------------------------------------------------------------------------
# a busca da configuracao no servidor central.
#
# fica em um documento separado, ativado apenas FORA do perfil de teste, e a razao e
# tecnica: o spring resolve o spring.config.import muito cedo, antes de ler
# application-test.yml -- entao desligar o cliente por ali chegaria tarde e os testes
# passariam a exigir um config server no ar. condicionar o proprio import ao perfil
# resolve isso e continua valendo quando os testes rodam pela IDE, sem depender de
# nenhuma flag na linha de comando.
#
# o import NAO e opcional de proposito. um servico que subisse sem as politicas que
# espera estaria rodando com um comportamento diferente do pretendido, e descobrir isso
# em producao e pior do que nao subir. o spring-retry no classpath, com o fail-fast
# abaixo, faz o servico ESPERAR o config server em vez de morrer quando a ordem de
# subida se inverte -- ate 20 tentativas, com 1 a 2 segundos entre elas.
# ---------------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 2000

# ---------------------------------------------------------------------------------
# o que este arquivo NAO tem mais, e onde foi parar:
#
#   eureka.client.service-url            -> config-server, application.yml (coringa)
#   eureka.instance.prefer-ip-address    -> config-server, application.yml (coringa)
#   eureka.client.healthcheck            -> config-server, engagement-service.yml
#   eureka.instance.lease-*              -> config-server, engagement-service.yml
#   management.endpoints / endpoint       -> config-server, engagement-service.yml
#   spring.rabbitmq.host/port/usuario    -> config-server, application.yml (coringa)
#   spring.rabbitmq.listener (retentativa, concorrencia, prefetch)
#                                        -> config-server, engagement-service.yml
#
# repare que o endereco do eureka saiu dos DOIS servicos e virou uma linha so no coringa.
# antes desta entrega ele estava duplicado, e duas copias de um endereco e uma delas
# esperando para ficar desatualizada.
# ---------------------------------------------------------------------------------
