# perfil de teste do microsservico. nem o config server nem o eureka sao consultados
# aqui: os testes nao devem depender de nenhum dos dois rodando na maquina. a busca de
# configuracao e cortada no proprio application.yml, que a condiciona ao perfil (!test).
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # sao necessarias DUAS coisas para os testes nao dependerem do config server, e elas
  # resolvem problemas diferentes:
  #
  # 1. o application.yml condiciona o spring.config.import ao perfil (!test). isso e o que
  #    evita a chamada http de verdade -- sem essa parte, o fail-fast e o retry fariam cada
  #    classe de teste gastar mais de um minuto tentando alcancar o servidor.
  # 2. esta propriedade aqui. o spring cloud instala um guard que exige um
  #    spring.config.import declarado sempre que o cliente de configuracao esta no
  #    classpath, e sem ela o contexto falha com "No spring.config.import set" -- agora
  #    justamente porque o import foi (corretamente) omitido.
  cloud:
    config:
      enabled: false

  # nenhum teste comum depende de um rabbitmq no ar. os consumidores nao sao iniciados
  # (os testes chamam os listeners como metodos; veja engagement.messaging abaixo), e a
  # porta 0 faz qualquer publicacao que escape falhar na hora -- o publicador de eventos
  # e de melhor esforco, entao a falha vai para o log e o teste segue. e o mesmo truque
  # do endereco invalido do cliente feign no monolito: se algo tentar sair da maquina,
  # falha rapido em vez de pendurar.
  #
  # o teste que precisa de um broker de verdade (MessagingIntegrationTest) sobe o dele
  # em um container e religa os consumidores.
  rabbitmq:
    port: 0
    listener:
      simple:
        retry:
          initial-interval: 100ms

# o que o MessagingStartup faria ao fim da subida fica desligado: anunciar o estado e
# ligar os consumidores
engagement:
  messaging:
    publish-snapshot-on-startup: false
    start-consumers-on-ready: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    org.springframework.amqp: error
    com.blog.engagement.messaging.EngagementEventPublisher: error
